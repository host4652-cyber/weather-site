stages:
  - test
  - build
  - deploy

test-job:
  stage: test
  script:
    - echo "Running tests..."

push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN"
  script:
    - docker build -t $DOCKERHUB_USER/weather-site:$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKERHUB_USER/weather-site:$CI_COMMIT_SHORT_SHA

deploy-job:
  stage: deploy
  script:
    - echo "Deploying application..."
